[package]
name = "ultrabar"
version = "0.0.4"
description = "Configure and control an UltraBar X display bar"
authors = ["Tomek Modrzynski"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ultrabar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Self-update from the GitHub releases, then relaunch into the new version.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "process", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
gethostname = "1"
thiserror = "2"
# Store catalog and shortcut-pack downloads. Same reqwest the updater uses,
# with the ring provider this app already installs.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# deflate-flate2 alone leaves flate2 without a backend; macOS only built because
# the updater pulls in flate2's default backend there, Windows doesn't.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
